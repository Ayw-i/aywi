<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are Ya Winning, Isles?</title>
  <style>
    body {
      background-color: #000000;
      color: white;
      font-family: Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Sound toggle + hover credit panel. Mirrors #yt-widget below: same
       button, same panel, but plays the state's own mp3 and links out to
       where the song lives. */
    #sound-widget {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
    }

    #sound-toggle {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      display: block;
      line-height: 1;
      position: relative;
      z-index: 1;   /* above the panel's hover bridge, so clicks still hit the button */
    }

    #sound-panel {
      position: absolute;
      top: -4px;
      left: 32px;
      background: #000;
      border: 1px solid #fff;
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    /* Invisible bridge over the gap between the button and the panel. Without
       it, moving the mouse across the gap drops the hover and the panel fades
       before you reach the Bandcamp link. It deliberately overlaps the button
       (whose width changes between ▶ and ⏸); the button sits on top of it. */
    #sound-panel::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -20px;
      width: 20px;
    }

    #sound-widget:hover #sound-panel { opacity: 1; pointer-events: auto; }

    #yt-widget {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #yt-bare {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      display: block;
      line-height: 1;
    }

    #yt-panel {
      position: absolute;
      top: -4px;
      left: 32px;
      background: #000;
      border: 1px solid #fff;
      padding: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    #yt-widget:hover #yt-panel { opacity: 1; pointer-events: auto; }

    #main {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 18pt;
      margin-bottom: 6px;
    }

    #site-header,
    .fade-section {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #site-header.visible,
    .fade-section.visible {
      opacity: 1;
    }

    nav {
      margin-bottom: 30px;
    }

    nav a {
      color: white;
      text-decoration: underline;
      margin: 0 8px;
      font-size: 11pt;
    }

    #mood-image {
      max-width: 50%;
      display: block;
      margin: 0 auto;
    }

    #mood-headline {
      font-size: 72pt;
      font-weight: bold;
      margin: 16px 0 30px 0;
      line-height: 1;
    }

    /* Text with a small note on hover (box styled like the GameScore
       breakdown). Deliberately no dotted underline — it's a hidden aside, and
       only the help cursor hints at it. Pure CSS :hover rather than mouseenter,
       because the pregame countdown re-renders every minute and a re-rendered
       element wouldn't get a fresh mouseenter under a still mouse. */
    .hover-note {
      position: relative;
      display: inline-block;
      cursor: help;
    }

    .hover-note-box {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 6px;
      width: 200px;
      z-index: 999;
      background: #111;
      border: 1px solid #555;
      padding: 5px 7px;
      font-size: 8pt;
      font-weight: normal;
      line-height: 1.4;
      color: #ccc;
      white-space: normal;
    }

    .hover-note:hover .hover-note-box { display: block; }

    #game-headline {
      font-size: 11pt;
      margin: 12px 0;
      text-align: left;
    }

    hr {
      border: none;
      border-top: 1px solid white;
      margin: 40px 0;
    }

    h2 {
      text-align: left;
      font-size: 18pt;
      margin: 30px 0 6px 0;
      text-transform: uppercase;
    }

    h3 {
      text-align: left;
      font-size: 11pt;
      margin: 6px 0 4px 0;
      text-transform: uppercase;
      font-weight: normal;
      opacity: 0.8;
    }

    .sort-ind {
      display: inline-block;
      width: 14px;
      text-align: right;
      font-size: 9pt;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10pt;
      text-align: left;
    }

    th, td {
      border: 1px solid white;
      padding: 4px 8px;
    }

    th {
      background-color: rgba(255, 255, 255, 0.15);
    }

    a {
      color: white;
    }

    /* News table keeps a fixed size so the « Prev / Next » links under it never
       move: fixed column widths (see its <colgroup>), one line per row, long
       headlines cut off with "…" (full text on hover via the link's title).
       The headline itself is the link to the article. */
    #news-table {
      table-layout: fixed;
    }

    #news-table col.news-site-col { width: 135px; }
    #news-table col.news-date-col { width: 100px; }

    #news-table th,
    #news-table td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #footer {
      font-size: 9pt;
      margin-top: 50px;
      opacity: 0.6;
    }

    /* Phones: the two-team tables in the live view (goals, penalties, goalies,
       skaters) need ~500-650px side by side, which made the whole page wider
       than the screen. Below 700px each team's table takes the full width,
       one above the other. Same rule in game.html. */
    @media (max-width: 700px) {
      table.team-pair,
      table.team-pair > tbody,
      table.team-pair > tbody > tr {
        display: block;
        width: 100%;
      }
      table.team-pair > tbody > tr > td {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 0 0 8px 0 !important;
      }

      /* Score: 42pt split "4 –" and "3" over two lines in the narrow center column */
      .live-score {
        font-size: 28pt !important;
        white-space: nowrap;
      }

      /* Live feed / play log: smaller text, tighter padding and narrower
         Time/Event columns, so the Details column gets most of the row */
      .live-feed-table td {
        font-size: 8pt !important;
      }
      .live-feed-table th,
      .live-feed-table td {
        padding: 3px 4px;
      }
      .live-feed-table col.feed-time-col  { width: 58px !important; }
      .live-feed-table col.feed-event-col { width: 76px !important; }

      /* News: smaller text and narrower Site/Date columns, so the headline
         gets most of the row (the site name is the one cut off with "…") */
      #news-table th,
      #news-table td {
        font-size: 9pt;
        padding: 4px 4px;
      }
      #news-table col.news-site-col { width: 70px; }
      #news-table col.news-date-col { width: 62px; }
    }
  </style>
</head>
<body>

<div id="sound-widget">
  <button id="sound-toggle" title="Toggle sound">&#9654;</button>
  <div id="sound-panel">
    <a id="sound-link" href="#" target="_blank" rel="noopener" title="Listen on Bandcamp" style="color:white;text-decoration:none;">
      <table style="width:auto;border-collapse:collapse;">
        <tr>
          <td style="border:none;padding:0 8px 0 0;vertical-align:middle;">
            <img id="sound-cover" src="" alt="" style="width:60px;height:60px;display:block;">
          </td>
          <td style="border:none;padding:0;vertical-align:middle;">
            <div id="sound-title" style="font-size:8pt;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;"></div>
            <div id="sound-artist" style="font-size:8pt;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:0.7;margin-top:2px;"></div>
            <div id="sound-source" style="font-size:8pt;opacity:0.7;margin-top:2px;"></div>
          </td>
        </tr>
      </table>
    </a>
  </div>
</div>

<div id="yt-widget">
  <button id="yt-bare">&#9208;</button>
  <div id="yt-panel">
    <table style="width:auto;border-collapse:collapse;">
      <tr>
        <td style="border:none;padding:0 8px 0 0;vertical-align:middle;">
          <img id="yt-cover" src="https://img.youtube.com/vi/GDP4ds-ozOI/mqdefault.jpg" style="width:80px;height:60px;display:block;">
        </td>
        <td style="border:none;padding:0;vertical-align:middle;">
          <div id="yt-title" style="font-size:8pt;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;"></div>
        </td>
      </tr>
    </table>
  </div>
</div>

<audio id="bg-audio" loop></audio>
<div id="yt-player" style="position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;"></div>

<div id="main">

  <div id="site-header">
    <div id="nav"></div>
    <script src="js/nav.js"></script>
  </div>

  <!-- MOOD SECTION — populated by detectAndRenderState() -->
  <div id="mood-section">
    <img id="mood-image" src="" alt="" style="display:none;">
    <div id="mood-headline"></div>
    <div id="mood-sub" style="font-size:10pt;opacity:0.8;margin-top:-20px;margin-bottom:10px;display:none;"></div>
    <div id="fight-content" style="display:none;margin-top:8px;"></div>
    <div id="live-scoreboard" style="margin-top:20px;"></div>
    <div id="schedule-out-table" style="margin-top:20px;text-align:left;"></div>
  </div>

  <!-- GAME SECTION — shown in Sorover/Clinched states; empty otherwise -->
  <div id="game-section" class="fade-section">
    <hr>
    <p id="game-headline"></p>
    <div id="prev-game-score"></div>
  </div>

  <!-- PERSISTENT SECTION -->
  <hr class="fade-section">

  <div class="fade-section">
    <h2>Islanders News</h2>
    <table id="news-table">
      <colgroup>
        <col>
        <col class="news-site-col">
        <col class="news-date-col">
      </colgroup>
      <thead>
        <tr>
          <th>Headline</th>
          <th>Site</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="news-tbody">
        <tr><td colspan="3">Loading...</td></tr>
      </tbody>
    </table>
    <div id="news-pager" style="margin-top:8px;"></div>
  </div>

  <!-- STATS — hidden by loadRosterStats() until the season has stats to show -->
  <div id="stats-section">

  <div class="fade-section">
    <h2>Stats</h2>
    <h3>Forwards</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>GP</th>
          <th>G</th>
          <th>A</th>
          <th>PTS</th>
          <th>+/-</th>
        </tr>
      </thead>
      <tbody id="forwards-tbody">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="fade-section">
    <h3>Defensemen</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>GP</th>
          <th>G</th>
          <th>A</th>
          <th>PTS</th>
          <th>+/-</th>
        </tr>
      </thead>
      <tbody id="defensemen-tbody">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="fade-section">
    <h3>Goalies</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th title="Games Started">GS</th>
          <th>W</th>
          <th>L</th>
          <th title="Shutouts">SO</th>
          <th>GAA</th>
          <th>SV%</th>
        </tr>
      </thead>
      <tbody id="goalies-tbody">
        <tr><td colspan="7">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  </div><!-- /stats-section -->

  <p id="footer">Last updated: —</p>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/utils.js"></script>
<script src="js/nhl-schedule.js"></script>
<script src="js/state.js"></script>
<script src="js/live-scoreboard.js"></script>
<script src="js/live-skaters.js"></script>
<script src="js/live-overlays.js"></script>
<script src="js/live-graph.js"></script>
<script src="js/live-game.js"></script>
<script src="js/news.js"></script>
<script src="js/roster.js"></script>
<script src="js/main.js"></script>

<!-- DEV ONLY — remove before production -->
<script src="dev.js"></script>

</body>
</html>
