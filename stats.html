<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats — Are Ya Winning, Isles?</title>
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #main {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
    }

    nav {
      text-align: center;
      margin-bottom: 30px;
    }

    nav a {
      color: white;
      text-decoration: underline;
      margin: 0 8px;
      font-size: 11pt;
    }

    h1 {
      font-size: 18pt;
      margin-bottom: 6px;
      text-align: center;
    }

    h2 {
      font-size: 18pt;
      text-transform: uppercase;
      margin: 30px 0 6px 0;
    }

    h3 {
      font-size: 11pt;
      text-transform: uppercase;
      font-weight: normal;
      opacity: 0.8;
      margin: 20px 0 4px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
      text-align: left;
    }

    th, td {
      border: 1px solid white;
      padding: 3px 6px;
      white-space: nowrap;
    }

    th {
      background-color: rgba(255, 255, 255, 0.15);
    }

    a {
      color: white;
    }

    #footer {
      font-size: 9pt;
      margin-top: 50px;
      opacity: 0.6;
    }

    .sort-ind {
      font-size: 8pt;
    }

    /* The skater tables have 13 columns that don't wrap (~530px), wider than
       a phone. Each table sits in its own scroll box, so a wide table scrolls
       sideways by itself instead of pushing the whole page off the screen. */
    .table-scroll {
      overflow-x: auto;
    }

    /* The Name column stays pinned to the left edge while the stat columns
       scroll underneath it. With border-collapse: collapse the pinned cells'
       borders would slide away with the rest of the table, so these tables
       use separate borders instead: every cell draws only its right and
       bottom edge, plus the top row and the Name column draw the outer edges. */
    .table-scroll table {
      border-collapse: separate;
      border-spacing: 0;
    }
    .table-scroll th,
    .table-scroll td {
      border-width: 0 1px 1px 0;
    }
    .table-scroll thead th {
      border-top-width: 1px;
    }
    .table-scroll th:first-child,
    .table-scroll td:first-child {
      position: sticky;
      left: 0;
      border-left-width: 1px;
      background-color: #000;   /* solid, so numbers don't show through */
    }
    .table-scroll th:first-child {
      background-color: #262626; /* same gray as the other headers, but solid */
    }

    /* Phones: tighter cells and page edges so more columns fit before
       scrolling kicks in. */
    @media (max-width: 700px) {
      #main {
        padding-left: 10px;
        padding-right: 10px;
      }
      table {
        font-size: 8pt;
      }
      th, td {
        padding: 3px 4px;
      }
    }
  </style>
</head>
<body>

<div id="main">

  <div id="nav"></div>
  <script src="js/nav.js"></script>

  <h2>Stats</h2>
  <div id="season-picker" style="text-align:left;margin-bottom:12px;"></div>

  <!-- Half-hidden link to the goal scorers timeline, same style as Goalies below -->
  <h3><a href="goals.html" style="color:inherit;text-decoration:underline dotted rgba(255,255,255,0.35);">Forwards</a></h3>
  <div class="table-scroll">
    <table id="forwards-table">
      <thead>
        <tr>
          <th title="Player name">Name</th>
          <th title="Position">Pos</th>
          <th title="Games played">GP</th>
          <th title="Goals">G</th>
          <th title="Assists">A</th>
          <th title="Points (goals + assists)">PTS</th>
          <th title="Plus/minus: net even-strength goals while on ice">+/-</th>
          <th title="Penalty minutes">PIM</th>
          <th title="Power play goals">PPG</th>
          <th title="Shots on goal">SOG</th>
          <th title="Shooting percentage">S%</th>
          <th title="Average time on ice per game">TOI</th>
          <th title="Points per 60 minutes of ice time">P/60</th>
        </tr>
      </thead>
      <tbody id="forwards-tbody">
        <tr><td colspan="13">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <h3>Defensemen</h3>
  <div class="table-scroll">
    <table id="defensemen-table">
      <thead>
        <tr>
          <th title="Player name">Name</th>
          <th title="Position">Pos</th>
          <th title="Games played">GP</th>
          <th title="Goals">G</th>
          <th title="Assists">A</th>
          <th title="Points (goals + assists)">PTS</th>
          <th title="Plus/minus: net even-strength goals while on ice">+/-</th>
          <th title="Penalty minutes">PIM</th>
          <th title="Power play goals">PPG</th>
          <th title="Shots on goal">SOG</th>
          <th title="Shooting percentage">S%</th>
          <th title="Average time on ice per game">TOI</th>
          <th title="Points per 60 minutes of ice time">P/60</th>
        </tr>
      </thead>
      <tbody id="defensemen-tbody">
        <tr><td colspan="13">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Half-hidden link to the goalie history graph: a faint dotted underline
       is the only hint that this header is clickable -->
  <h3><a href="goalies.html" style="color:inherit;text-decoration:underline dotted rgba(255,255,255,0.35);">Goalies</a></h3>
  <div class="table-scroll">
    <table id="goalies-table">
      <thead>
        <tr>
          <th title="Player name">Name</th>
          <th title="Games played">GP</th>
          <th title="Wins">W</th>
          <th title="Regulation losses">L</th>
          <th title="Overtime/shootout losses">OTL</th>
          <th title="Shutouts">SO</th>
          <th title="Goals against average">GAA</th>
          <th title="Save percentage">SV%</th>
          <th title="Shots against">SA</th>
        </tr>
      </thead>
      <tbody id="goalies-tbody">
        <tr><td colspan="9">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <p id="footer">Last updated: —</p>

</div>

<script src="js/utils.js"></script>
<script src="js/nhl-schedule.js"></script>
<script src="js/stats.js"></script>

</body>
</html>
